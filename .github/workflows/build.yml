name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12-build-${{ github.run_number }}
          name: 音准大脑 v1.12 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.12 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.12。

            ✨ v1.12 更新内容
            · 【修复】旋律跟读：弹错归零后点「再听一遍」，重播完点琴键没反应不判定的 bug——重播结束后正确恢复到「输入中」状态
            · 【音准核查】7 个音 + 高音哆全部对照国际标准音高逐一验证，偏差 ≤0.002%（人耳不可分辨），音准无问题
            · 【判定核查】听音辨名 / 音名反应 / 旋律跟读判定逻辑逐行复核：播的音与正确答案同源、字母与唱名映射一致、按你的点击严格判定，无误
            · 此前修复全部保留：弹错不循环重播、洗牌袋出题、重复音闪烁、防连点计分

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

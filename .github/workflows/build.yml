name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7-build-${{ github.run_number }}
          name: 音准大脑 v1.7 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.7 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.7。

            ✨ v1.7 更新内容（重要修复）
            · 【修复 v1.6 回归】钢琴/练耳/旋律跟读/歌曲播放时好时坏、部分音不发声、声音发怪：v1.6 的停止逻辑误杀新音，已重写音频引擎——每个音独立发声互不干扰，点击必响、音色稳定
            · 旋律跟读「重听」按钮改为「🔊 再听一遍」，带文字一眼看懂；最右侧高音键改为「高音哆/高1」清晰标注
            · 难度按钮行按权重均分，任何屏幕都不会挤压变形

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

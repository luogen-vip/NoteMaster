name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4-build-${{ github.run_number }}
          name: 音准大脑 v1.4 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.4 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.4。

            ✨ v1.4 更新内容
            · 歌曲详情页「正在播放」面板全新设计：跳动音量条 + 大号当前音徽章 + 本句第几个音，播放状态一眼可见
            · 系统返回（手势/返回键）从歌曲详情返回歌曲列表，不再跳回首页
            · 练耳「今日战绩」答题后实时刷新，不用切页
            · 听音辨名 / 音名反应改为洗牌轮换出题：7 个音每轮各出现一次，不再有音被遗漏
            · 听音辨名播放按钮：播放中显示「❚❚ 播放中…」，播完自动恢复
            · 简谱继续校正（青花瓷·宣纸上走笔、可不可以·就这样和你在一起）

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

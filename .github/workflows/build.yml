name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.16-build-${{ github.run_number }}
          name: 音准大脑 v1.16 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.16 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.16。

            ✨ v1.16 更新内容（声音合成彻底重做：谱子数字不变，只把「放出来的声音」修到贴近原版）
            · 【音尾不再变小】衰减速率随音长自适应：长音整段保持可闻（旧版固定衰减，长音放到一半就没声、像「唱不出来」）
            · 【消除破音】每个音末尾 45ms 线性淡出，消除音尾硬切产生的「咔」声
            · 【更像原唱】泛音从 3 个增加到 5 个，音色更饱满；音符间隙从 10% 收窄到 5%，整句连唱不断气
            · 【低音更清楚】低音区响度自动补偿（最多 +22%），低音不再「出不来」
            · 【下滑音更自然】滑音改为等程指数滑音，听起来是匀速下滑（旧版线性滑音先快后慢很怪）
            · 【节奏更稳】音频线程提升到紧急音频优先级，减少起音延迟抖动
            · 【曲谱】沿用 v1.15 已核对的原版制谱（可不可以/童话镇已替换、青花瓷/童话逐句核对），数字完全不动
            · 此前修复全部保留：两只老虎遍数、练耳判定、音频多轨道、小窗播放

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

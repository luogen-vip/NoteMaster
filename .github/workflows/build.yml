name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6-build-${{ github.run_number }}
          name: 音准大脑 v1.6 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.6 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.6。

            ✨ v1.6 更新内容
            · 适配手机「超大字体」：全 App 字体缩放封顶，修复系统大字体下「停止」按钮被挤成右上角细竖条、随机灵感变圆形、低音区竖排、底部导航折行等一系列挤压 bug
            · 歌曲详情页播放按钮重设计：全宽大按钮「▶ 播放整首歌 / ⏸ 停止播放」，不再藏在角落
            · 修复播放/试听中切到其他页再切回，按钮卡死在「播放中/试听中」且点不动的问题；切页立即停声、状态归零
            · 歌曲列表：从详情页返回时停在你点进去时的位置，不再跳回顶部
            · 练耳页整体紧凑化，全部内容一屏显示，不需要滑动
            · 写歌页：删除反馈时的自动滚动，点随机灵感/试听不再突然跳动；试听/随机/重置三按钮按权重均分不再互相挤压
            · 《可不可以》副歌再校正：每句收尾音改为原曲的低音6（拉），句句平行向下收，更像原曲

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

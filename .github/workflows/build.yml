name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.11-build-${{ github.run_number }}
          name: 音准大脑 v1.11 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.11 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.11。

            ✨ v1.11 更新内容
            · 【旋律跟读·弹错不再循环重播】弹错即归零停下，由你决定：点「🔊 再听一遍」重听，或点 3/5/7 音开始新旋律，绝不自动无限循环
            · 【旋律覆盖所有音】出题改为洗牌袋算法：8 个音（含高音哆）洗成一叠逐个抽、抽完重洗，每个音都会被照顾到，不写死不霸屏
            · 【重复音也有高亮】每个音播完先熄灭高亮再播下一个，连续相同的音会闪烁两次，一眼数清到底弹了几个音
            · 此前修复全部保留：逐位判定、进度圆点、防连点计分、音频引擎每音必响、小窗播放不中断

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

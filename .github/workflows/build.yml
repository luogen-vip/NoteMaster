name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10-build-${{ github.run_number }}
          name: 音准大脑 v1.10 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.10 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.10。

            ✨ v1.10 更新内容
            · 【旋律跟读防盲猜】弹错后旋律自动重新播放一遍，听完才能再弹——不再是清零后可以闭眼乱猜，逻辑闭环：听→弹→错→重听→再弹
            · 【防连点重复计分】听音辨名 / 音名反应答完后的过渡期内再点按钮不再重复计战绩、不再弄乱连击
            · 【防播放重叠】旋律播放中点击难度按钮或"再听一遍"不再叠加第二遍播放
            · 此前修复全部保留：逐位判定、进度圆点、高音哆判定、音频引擎每音必响、小窗播放不中断

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

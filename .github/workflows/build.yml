name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.13-build-${{ github.run_number }}
          name: 音准大脑 v1.13 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.13 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.13。

            ✨ v1.13 更新内容
            · 【修复】旋律跟读演示时「高音哆」只出声不亮灯的问题——现在 8 个键演示时全部会高亮闪烁，每个音落在哪一眼看清
            · 此前修复全部保留：再听一遍后正常判定、弹错不循环重播、洗牌袋出题、重复音闪烁、防连点计分、音准达标

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5-build-${{ github.run_number }}
          name: 音准大脑 v1.5 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.5 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.5。

            ✨ v1.5 更新内容
            · 简谱对照权威制谱全面再校正八度：童话主歌低音5、青花瓷「你眼带笑意/冉冉檀香/嫣然」低音区、两只老虎「一只没有眼睛/一只没有尾巴/真奇怪」（真奇怪按原曲唱两遍、低音5）
            · 练耳：连击说明更清晰（连击=连续答对不中断，答错清零）；答题反馈改为固定占位，不再把页面往下挤；顶部留白收窄
            · 写歌「试听」按钮：试听中显示「❚❚ 试听中」，播完自动恢复
            · 学乐理「核心对照表」、写歌卡片标题文字改为白色，黑底黑字看不清的问题修复
            · 歌曲页播放中的当前音改为金色大高亮，更醒目

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.15-build-${{ github.run_number }}
          name: 音准大脑 v1.15 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.15 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.15。

            ✨ v1.15 更新内容
            · 【曲谱替换】《可不可以》整首换为刘伟锋原版官方制谱（1=bD ♩=67）：主歌 6 句 + 「我可以」段落 + 完整副歌，副歌按原谱在高音区（′），不再是简化低音版
            · 【曲谱替换】《童话镇》整首换为「小野版」制谱（1=C a 小调色彩）：主歌 8 句 + 「睿智的河水」段 + 完整副歌「七彩的河」，共 18 句（原 6 句）
            · 【逐音核对】《青花瓷》《童话》与所提供制谱逐句 1:1 比对一致，未改动；全部 86 句字音核对通过（差异处均为原谱拖腔）
            · 此前修复全部保留：两只老虎遍数、练耳判定、音频引擎、小窗播放

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

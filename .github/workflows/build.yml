name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.17-build-${{ github.run_number }}
          name: 音准大脑 v1.17 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.17 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.17。

            ✨ v1.17 更新内容（《可不可以》逐音对照原版官方制谱修正八度与缺音）
            · 你说得对：问题确实出在「哪里该高哪里该低」！本次找到《可不可以》原版官方制谱（刘伟锋 词曲，1=bD ♩=67）逐音逐八度比对，修正如下
            · 【结尾句】「趁你还愿意」原版是 7 个音（趁7 你7 还1′ 愿2′ 意拖腔2′→1′），旧版只有 4 个音且音高全错
            · 【副歌八度全面修正】原版副歌是高低音交错，不是全高音：「和你在一起」6 6 3 6 3′ 2′、「我们之间有太多回忆」3′ 2′ 1′ 5 5 3 5 2′ 2′ 1′、「只愿意和你永远不分离」7 7 7 5 5′ 3′…（旧版整句抬太高）
            · 【主歌修正】「你已不在原地」应为低音区 6̣ 6̣ 6̣ 7̣；「发现离不开你」补回漏掉的 1 个音（原版 6 音旧版 5 音）；「我可以 / 接受你的所有 / 偶尔给你带来」的低音 6 全部修正
            · 【过桥段修正】「你的心伤我能治愈」「我的快乐也只有你能给予」（含「给予」的原版下行拖腔 1′ 7′ 1′ 1′ 6 5）、「我们就别再分离」高音 1′ 修正
            · 其他歌曲（青花瓷/童话/童话镇/小星星/两只老虎）维持已核对版本，一字未动
            · v1.16 的声音合成升级全部保留：自适应衰减、45ms 淡出消破音、5 泛音、低音补偿、指数滑音

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

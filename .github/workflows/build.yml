name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8-build-${{ github.run_number }}
          name: 音准大脑 v1.8 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.8 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.8。

            ✨ v1.8 更新内容
            · 写歌页「万能和弦进行」循环播放体验优化：第一遍播完后先短暂停顿一下（约半秒多）再重播第二遍，能清楚分辨"这一遍读完了"，不会糊在一起
            · 【修复】上滑小窗 / 分屏时播放状态不再丢失：正在播放的歌曲、和弦、试听继续播放不中断，恢复全屏后仍是正在播放状态
            · 此前 v1.7 的修复保留：钢琴/练耳/旋律跟读/歌曲每个音必响、音色稳定

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk

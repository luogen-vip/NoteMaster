name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteMaster-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9-build-${{ github.run_number }}
          name: 音准大脑 v1.9 (Build ${{ github.run_number }})
          body: |
            音准大脑 NoteMaster v1.9 —— 用「哆来咪发嗦拉西」练出写歌的耳朵。

            📦 下载 app-debug.apk 直接安装（允许安装未知来源应用）。每次更新都会发布新版本号，此为 v1.9。

            ✨ v1.9 更新内容
            · 【旋律跟读判定逻辑重做】严格逐位判定：第几个音就必须对第几个音；弹错明确提示「第 X 个音弹错了，从头再来」，不再默默清零让人误会
            · 新增进度圆点显示（●已连对 ○还没对），弹错归零一眼可见
            · 【修复逻辑漏洞】「高音哆」键此前听着是高音却按中音"1"判定，对不上；现在旋律里可能出现高音哆，8 个琴键都是合法答案，判定与琴键一一对应
            · 此前修复全部保留：音频引擎每音必响、切页停声、小窗/分屏播放不中断、和弦循环停顿

            📚 包含：乐理 8 课 · 听音辨名 / 音名反应 / 旋律跟读 · 互动钢琴 · 6 首热歌简谱 · 写歌工具
            作者 罗根 ❤
          files: app/build/outputs/apk/debug/*.apk
